[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 44444444
via_ir = true
bytecode_hash = "none"
remappings = [
  "@v4-core/=lib/v4-core/src/",
  "forge-std/=lib/v4-core/lib/forge-std/src/",
  "solmate/=lib/v4-core/lib/solmate/",
]

[profile.default.fuzz]
runs = 512
